stages: #阶段 
  - scp_files_to_production_server

variables:
  BASEDIR: "/data/django/Experiment-Tracking-App/"
  REMOTEHOST: 172.28.20.105
scp_files_to_production_server:
  stage: scp_files_to_production_server
  script: 
    - id
    - echo $CI_COMMIT_SHA
    - echo $CI_COMMIT_BEFORE_SHA
    - echo $IDENTITY
    - files=$(git diff --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA)
    - echo "Changed files:$files"
    # - chmod 600 $IDENTITY
    - for file in $files ;do
    -   remote_dir=$(dirname "$file")
    -   if [ "$remote_dir" != "." ]; then
    -     ssh -i $IDENTITY root@$REMOTEHOST "mkdir -p /$BASEDIR/$remote_dir"
    -   fi
    -   scp -i $IDENTITY "./$file" root@$REMOTEHOST:"/$BASEDIR/$file"
    - done
    - ssh -i $IDENTITY root@$REMOTEHOST "supervisorctl stop experiment_app:*"
    - ssh -i $IDENTITY root@$REMOTEHOST "cd $BASEDIR/experiment_app; python3 manage.py makemigrations;python3 manage.py migrate"
    # - ssh -i $IDENTITY root@$REMOTEHOST "cd $BASEDIR; python3 manage.py collectstatic"
    - ssh -i $IDENTITY root@$REMOTEHOST "supervisorctl start experiment_app:*"
    - ssh -i $IDENTITY root@$REMOTEHOST "echo 'helloexperiment' > /tmp/2.txt"
  only:
    - master
    - main

  tags:
    - "103"