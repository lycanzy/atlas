{% extends "experiment_flow/base.html" %}

{% block content %}
<h2>Add New Flow</h2>
{% if error %}
<div style="background-color: #ffebee; color: #c62828; padding: 1rem; margin-bottom: 1rem; border-radius: 4px;">
    {{ error }}
</div>
{% endif %}
<form method="post" action="{% url 'add_flow' experiment.id %}">
    {% csrf_token %}
    <div style="margin-bottom: 1rem;">
        <label for="name" style="display:block; margin-bottom:0.5rem;">Flow Name (2 letters only):</label>
        <input type="text" name="flow_name" required maxlength="2" pattern="[A-Za-z]{2}" 
               style="width:100%; padding:0.5rem; border:1px solid #ccc; border-radius:4px;"
               title="Please enter exactly 2 letters">
    </div>
    <button type="submit" style="background-color:#007bff; color:#fff; padding:0.5rem 1rem; border:none; border-radius:4px; cursor:pointer;">Add Flow</button>
</form>
{% endblock %}
