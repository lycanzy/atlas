<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>步骤条码 - {{ step.full_step }}</title>
    <style>
        @media print {
            .no-print {
                display: none;
            }
            body {
                margin: 0;
                padding: 20px;
            }
        }
        
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }

        .step-info {
            margin-bottom: 10px;
        }
        
        .step-info h1 {
            color: #1a1a2e;
            margin: 0 0 10px 0;
            font-size: 30px;
        }
        
        .step-info p {
            color: #666;
            margin: 5px 0;
            font-size: 25px;
        }
        
        .barcode-display {
            margin: 30px 0;
            padding: 0px;
            background: #fff;
        }
        
        .barcode-display svg {
            max-width: 100%;
            height: auto;
        }
        
        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background-color: #16213e;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #0f1729;
        }
        
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background-color: #5a6268;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body>
    <div class="barcode-container">
        <div class="step-info">
            <h1>{{ step.full_step }}</h1>
        </div>
        
        <div class="barcode-display">
            <svg id="barcode"></svg>
        </div>
        
    </div>
    
    <script>
        // Generate barcode using JsBarcode
        JsBarcode("#barcode", "{{ barcode_id }}", {
            format: "CODE128",
            width: 5,
            height: 100,
            displayValue: false,
            margin: 1
        });
    </script>
</body>
</html>
