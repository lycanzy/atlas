{% extends "experiment_flow/base.html" %}

{% block content %}
<h2>Add New Experiment</h2>
<form method="post" action="{% url 'add_experiment' %}">
    {% csrf_token %}
    <div style="margin-bottom: 1rem;">
        <label for="exp_name" style="display:block; margin-bottom:0.5rem;">Experiment Name:</label>
        <input type="text" id="exp_name" name="exp_name" required style="width:100%; padding:0.5rem; border:1px solid #ccc; border-radius:4px;">
    </div>
    <button type="submit" style="background-color:#007bff; color:#fff; padding:0.5rem 1rem; border:none; border-radius:4px; cursor:pointer;">Add Experiment</button>
</form>
{% endblock %}
