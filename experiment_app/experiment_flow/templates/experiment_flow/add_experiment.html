{% extends "experiment_flow/base.html" %}

{% block content %}
<h2>Add New Experiment</h2>
{% if error %}
<div class="alert alert-danger" role="alert">
    {{ error }}
</div>
{% endif %}
<form method="post" action="{% url 'add_experiment' %}">
    {% csrf_token %}
    <div style="margin-bottom: 1rem;">
        <label for="project" style="display:block; margin-bottom:0.5rem;">Select Project:</label>
        <select id="project" name="project" required class="form-select" style="width:100%; padding:0.5rem; border:1px solid #ccc; border-radius:4px;">
            <option value="">Choose a project...</option>
            {% for project in projects %}
                <option value="{{ project.id }}">{{ project.project_name }} ({{ project.project_code }})</option>
            {% endfor %}
        </select>
    </div>
    <div style="margin-bottom: 1rem;">
        <label for="exp_description" style="display:block; margin-bottom:0.5rem;">Experiment Description:</label>
        <textarea id="exp_description" name="exp_description" class="form-control" rows="3" 
                  placeholder="Enter experiment description"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Create Experiment</button>
</form>
{% endblock %}
