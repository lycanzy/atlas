<div class="form-section cell-editor-section"
     data-sample-search-url="{% url 'search_linkable_samples' %}"
     data-sample-filter-url="{% url 'sample_link_filter_options' %}">
  <div class="section-title d-flex align-items-center justify-content-between">
    <span>电芯</span><span class="cell-editor-count">{{ cells|length }} 个</span>
  </div>
  <div class="cell-entry-grid">
    <div class="form-group">
      <label for="cell-package-input">测试单号 *</label>
      <input type="text" id="cell-package-input" class="form-control cell-package-input" maxlength="100" autocomplete="off" placeholder="例如 TEST-001">
    </div>
    <div class="form-group">
      <label for="cell-test-item-input">测试项目</label>
      <select id="cell-test-item-input" class="form-select cell-test-item-input">
        <option value="">未指定</option>
        {% for item in cell_test_items %}<option value="{{ item.id }}" {% if not item.is_active %}disabled{% endif %}>{{ item.name }}{% if not item.is_active %}（已停用）{% endif %}</option>{% endfor %}
      </select>
    </div>
    <div class="form-group cell-barcode-entry">
      <label for="cell-barcode-input">Barcode *</label>
      <textarea id="cell-barcode-input" class="form-control cell-barcode-input" rows="2" autocomplete="off" placeholder="连续扫码，或每行粘贴一个 Barcode"></textarea>
    </div>
    <button type="button" class="btn btn-sm btn-success add-cells-to-list-btn"><i class="bi bi-plus-lg" aria-hidden="true"></i> 加入列表</button>
  </div>
  <div class="cell-editor-error" role="alert" hidden></div>
  <div class="cell-editor-table-wrap">
    <table class="table table-sm table-bordered cell-editor-table">
      <thead class="table-light"><tr><th>测试单号</th><th>Barcode</th><th>测试项目</th><th>关联样品</th><th class="text-center">操作</th></tr></thead>
      <tbody class="cells-editor-container">
        {% for cell in cells %}
        <tr class="cell-editor-row" data-cell-id="{{ cell.id }}">
          <td><input type="text" class="form-control form-control-sm cell-row-package" maxlength="100" value="{{ cell.test_order_number }}" aria-label="测试单号"></td>
          <td><input type="text" class="form-control form-control-sm cell-row-barcode" maxlength="100" value="{{ cell.barcode }}" aria-label="Barcode"></td>
          <td>
            <select class="form-select form-select-sm cell-row-test-item" aria-label="测试项目">
              <option value="">未指定</option>
              {% for item in cell_test_items %}<option value="{{ item.id }}" {% if cell.test_item_id == item.id %}selected{% elif not item.is_active %}disabled{% endif %}>{{ item.name }}{% if not item.is_active %}（已停用）{% endif %}</option>{% endfor %}
            </select>
          </td>
          <td>
            <div class="cell-linked-samples" aria-label="已关联样品">
              {% for link in cell.sample_links.all %}<span class="cell-linked-sample-chip" data-sample-id="{{ link.sample_id }}" data-sample-name="{{ link.sample.sample_name }}" data-sample-step="{{ link.sample.step.full_step|default:'' }}" title="来自 {{ link.sample.step.full_step|default:'未知步骤' }}">{{ link.sample.sample_name }}</span>{% endfor %}
            </div>
            <button type="button" class="btn btn-link btn-sm link-cell-samples-btn"><i class="bi bi-link-45deg" aria-hidden="true"></i> 关联样品</button>
          </td>
          <td class="text-center"><button type="button" class="btn btn-sm btn-outline-danger remove-cell-row-btn" title="移除电芯" aria-label="移除电芯 {{ cell.barcode }}"><i class="bi bi-trash" aria-hidden="true"></i></button></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <div class="cell-editor-empty text-muted" {% if cells %}hidden{% endif %}>尚未添加电芯。</div>
  </div>
  <div class="cell-sample-picker-backdrop" hidden></div>
  <aside class="cell-sample-picker" role="dialog" aria-modal="true" aria-label="关联来源样品" hidden>
    <div class="cell-sample-picker-header">
      <div><h3>关联来源样品</h3><p class="cell-sample-picker-cell">当前 Cell</p></div>
      <div class="cell-sample-picker-header-actions">
        <span class="cell-sample-selected-badge">已选择 <span class="cell-sample-selected-count">0 个</span></span>
        <button type="button" class="btn-close close-cell-sample-picker" aria-label="关闭"></button>
      </div>
    </div>
    <div class="cell-sample-picker-body">
      <label class="cell-sample-search-label" for="cell-sample-search-input">搜索样品</label>
      <div class="cell-sample-search-wrap"><i class="bi bi-search" aria-hidden="true"></i><input id="cell-sample-search-input" type="search" class="form-control cell-sample-search-input" autocomplete="off" placeholder="输入至少 2 位样品编号，例如 PRA001"></div>
      <div class="cell-sample-filters">
        <select class="form-select form-select-sm cell-sample-project-filter" aria-label="按 Project 筛选"><option value="">全部 Project</option></select>
        <select class="form-select form-select-sm cell-sample-experiment-filter" aria-label="按 Experiment 筛选" disabled><option value="">全部 Experiment</option></select>
        <select class="form-select form-select-sm cell-sample-step-filter" aria-label="按 Step 筛选" disabled><option value="">全部 Step</option></select>
      </div>
      <div class="cell-sample-search-status" role="status">输入样品编号，或先选择筛选条件。</div>
      <div class="cell-sample-results"></div>
      <button type="button" class="btn btn-outline-secondary btn-sm cell-sample-load-more" hidden>加载更多</button>
    </div>
    <div class="cell-sample-permission-note"><i class="bi bi-shield-check" aria-hidden="true"></i> 跨步骤关联允许；无权限的 Team 数据不会显示。</div>
    <div class="cell-sample-picker-footer">
      <button type="button" class="btn btn-outline-secondary clear-cell-samples-btn">清除选择</button>
      <div class="cell-sample-picker-footer-actions">
        <button type="button" class="btn btn-outline-secondary close-cell-sample-picker">取消</button>
        <button type="button" class="btn btn-primary apply-cell-samples-btn">应用关联</button>
      </div>
    </div>
  </aside>
</div>
