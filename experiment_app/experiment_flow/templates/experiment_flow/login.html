<!DOCTYPE html>
<html lang="zh-CN">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Atlas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'app/css/app.css' %}?v=1">
    <style>
        body {
            background-color: #f7f7f7;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(20,30,60,0.1);
            padding: 40px;
            max-width: 400px;
            width: 100%;
            border: 1px solid #e6eefc;
        }
        .login-title {
            text-align: center;
            margin-bottom: 10px;
            color: #1a56db;
            font-weight: 700;
            font-size: 1.5rem;
        }
        .login-subtitle {
            text-align: center;
            margin-bottom: 30px;
            color: #6b7280;
            font-size: 0.9rem;
        }
        .btn-login {
            background-color: #3b6ef6;
            border: none;
            color: white;
            padding: 10px;
            font-weight: 500;
            width: 100%;
            border-radius: 6px;
            transition: background-color 0.2s;
        }
        .btn-login:hover {
            background-color: #2563eb;
            color: white;
        }
        .form-control {
            border-radius: 6px;
            padding: 0.6rem 0.75rem;
            border: 1px solid #d1d5db;
        }
        .form-control:focus {
            border-color: #3b6ef6;
            box-shadow: 0 0 0 0.2rem rgba(59, 110, 246, 0.25);
        }
        .form-label {
            font-weight: 500;
            color: #374151;
            font-size: 0.9rem;
        }
        .experiment-icon {
            text-align: center;
            font-size: 48px;
            margin-bottom: 15px;
            color: #3b6ef6;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="experiment-icon">
            <i class="bi bi-activity"></i>
        </div>
        <h2 class="login-title">Atlas</h2>
        <p class="login-subtitle">请登录你的账号</p>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="关闭"></button>
                </div>
            {% endfor %}
        {% endif %}
        
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">用户名</label>
                <input type="text" class="form-control" id="username" name="username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">密码</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-login">登录</button>
        </form>
        
        <div class="mt-3 text-center text-muted">
            <small>如需创建账号，请联系管理员</small>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
