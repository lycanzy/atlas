<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Delete modal visual comparison</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1440px; height: 550px; overflow: hidden; background: #111827; }
    main { display: grid; grid-template-columns: 720px 720px; }
    figure { margin: 0; position: relative; }
    figcaption { height: 44px; padding: 11px 18px; color: #fff; font: 600 16px/22px system-ui, sans-serif; }
    img { display: block; width: 700px; height: 498px; margin: 0 10px; object-fit: fill; }
  </style>
</head>
<body>
  <main>
    <figure><figcaption>Selected visual target</figcaption><img src="source-1440x1024.png" alt="Selected design"></figure>
    <figure><figcaption>Browser implementation</figcaption><img src="implementation-1440x1024-normalized.png" alt="Rendered implementation"></figure>
  </main>
</body>
</html>
