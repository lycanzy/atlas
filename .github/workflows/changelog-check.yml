name: Changelog automation tests

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test changelog release automation
        run: python3 -m unittest scripts/test_release_changelog.py
