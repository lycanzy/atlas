name: Release changelog

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-changelog-main
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Update to latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Freeze Unreleased notes
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          latest_tag="$(git tag --sort=-version:refname | sed -n '1p')"
          release_args=()
          while IFS= read -r subject; do
            if [ -n "$subject" ]; then
              release_args+=(--commit-subject "$subject")
            fi
          done < <(git log --reverse --no-merges --format=%s "$BEFORE_SHA..$HEAD_SHA")
          version="$(python3 scripts/release_changelog.py \
            --fallback-version "${latest_tag:-v0.1.0-alpha}" \
            "${release_args[@]}")"
          if [ -n "$version" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit released notes
        if: steps.release.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Release ${VERSION} [skip release]"
          git push origin main
